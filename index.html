<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs Bitcoina na żywo (15 min)</title>
    <!-- Biblioteka Chart.js do rysowania wykresu -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121826;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1b2234;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #f7931a; /* Kolor Bitcoina */
        }

        .price-container {
            font-size: 36px;
            font-weight: bold;
            margin: 15px 0;
        }

        .status {
            font-size: 14px;
            color: #8a99ad;
            margin-bottom: 20px;
        }

        .chart-box {
            position: relative;
            width: 100%;
            height: 350px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bitcoin (BTC / USD)</h1>
        <div class="price-container">
            $<span id="current-price">---.--</span>
        </div>
        <div class="status" id="status">Pobieranie pierwszych danych...</div>

        <div class="chart-box">
            <canvas id="btcChart"></canvas>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd';
        
        // Konfiguracja czasowa: 15 minut = 900 sekund
        // Pobieramy dane co 5 sekund -> max 180 punktów na wykresie
        const FETCH_INTERVAL_MS = 5000;
        const MAX_TIME_WINDOW_SEC = 15 * 60; 
        const MAX_POINTS = MAX_TIME_WINDOW_SEC / (FETCH_INTERVAL_MS / 1000);

        const priceElement = document.getElementById('current-price');
        const statusElement = document.getElementById('status');

        // Inicjalizacja wykresu Chart.js
        const ctx = document.getElementById('btcChart').getContext('2d');
        const btcChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], // Czas (np. 14:05:10)
                datasets: [{
                    label: 'Cena BTC (USD)',
                    data: [], // Wartości ceny
                    borderColor: '#f7931a',
                    backgroundColor: 'rgba(247, 147, 26, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.2, // Delikatne wygładzenie linii
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        grid: { color: '#2a3447' },
                        ticks: { color: '#8a99ad', maxTicksLimit: 8 }
                    },
                    y: {
                        grid: { color: '#2a3447' },
                        ticks: { color: '#8a99ad' }
                    }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });

        // Funkcja pobierająca aktualny kurs
        async function fetchBtcPrice() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Błąd połączenia z API');
                
                const data = await response.json();
                const price = data.bitcoin.usd;
                const now = new Date();
                const timeLabel = now.toLocaleTimeString();

                // 1. Aktualizacja ceny w nagłówku
                priceElement.innerText = price.toLocaleString('en-US', { minimumFractionDigits: 2 });

                // 2. Dodanie danych do wykresu
                btcChart.data.labels.push(timeLabel);
                btcChart.data.datasets[0].data.push(price);

                // 3. Ograniczenie punktów do okna 15-minutowego
                if (btcChart.data.labels.length > MAX_POINTS) {
                    btcChart.data.labels.shift(); // Usuń najstarsza etykietę
                    btcChart.data.datasets[0].data.shift(); // Usuń najstarszą cenę
                }

                // 4. Odświeżenie rysowania wykresu
                btcChart.update();
                statusElement.innerText = `Ostatnia aktualizacja: ${timeLabel} (Odświeżanie co 5s)`;

            } catch (error) {
                console.error('Błąd:', error);
                statusElement.innerText = 'Nie udało się pobrać danych z API.';
            }
        }

        // Pierwsze pobranie danych od razu po załadowaniu strony
        fetchBtcPrice();

        // Ustawienie interwału pobierania danych co 5 sekund
        setInterval(fetchBtcPrice, FETCH_INTERVAL_MS);
    </script>

</body>
</html>
